<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>360 Live API Demo</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #10151f; color: #f4f7fb; }
    main { max-width: 1080px; margin: auto; padding: 28px 20px 48px; }
    h1 { margin: 0 0 8px; } .subtle { color: #b8c4d4; }
    .layout { display: grid; grid-template-columns: minmax(270px, 360px) minmax(300px, 1fr); gap: 20px; margin-top: 24px; }
    .card { background: #1b2432; border: 1px solid #354459; border-radius: 12px; padding: 18px; }
    label { display: block; margin: 14px 0 4px; font-weight: 650; }
    input[type="range"] { width: 100%; } output { float: right; color: #7dd3fc; font-variant-numeric: tabular-nums; }
    .modes, .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    button { background: #1677ff; color: white; border: 0; border-radius: 7px; padding: 9px 12px; font: inherit; cursor: pointer; }
    button.secondary { background: #354459; } code { overflow-wrap: anywhere; color: #a5f3fc; }
    img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; background: #060a10; border-radius: 9px; }
    #status { min-height: 22px; color: #b8c4d4; } #api-url { display: block; margin-top: 12px; }
    a { color: #7dd3fc; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>360 Live Stream — API Demo</h1>
    <p class="subtle">หน้านี้ส่ง yaw, pitch, fov และ mode ไปที่ <code>/pano/view</code> เพื่อทดสอบตามโจทย์</p>
    <div class="layout">
      <section class="card">
        <label for="yaw">Yaw <output id="yaw-value">0°</output></label>
        <input id="yaw" type="range" min="-180" max="360" value="0" step="1">
        <label for="pitch">Pitch <output id="pitch-value">0°</output></label>
        <input id="pitch" type="range" min="-90" max="90" value="0" step="1">
        <label for="fov">Field of view <output id="fov-value">90°</output></label>
        <input id="fov" type="range" min="10" max="150" value="90" step="1">
        <label>Mode</label>
        <div class="modes">
          <label><input type="radio" name="mode" value="360" checked> 360°</label>
          <label><input type="radio" name="mode" value="180"> 180°</label>
        </div>
        <div class="actions">
          <button id="left" class="secondary">← 30°</button>
          <button id="refresh">ขอภาพ</button>
          <button id="right" class="secondary">30° →</button>
        </div>
        <label><input id="auto-refresh" type="checkbox"> อัปเดตอัตโนมัติทุก 0.5 วินาที</label>
        <p id="status">กำลังตรวจสถานะ server…</p>
        <a href="/pano/full" target="_blank" rel="noopener">เปิดภาพ 360 เต็มใบ (/pano/full)</a>
      </section>
      <section class="card">
        <img id="view" alt="Perspective view returned by the panorama API">
        <code id="api-url"></code>
      </section>
    </div>
  </main>
  <script>
    const [yaw, pitch, fov] = ["yaw", "pitch", "fov"].map(id => document.getElementById(id));
    const controls = [yaw, pitch, fov];
    const image = document.getElementById("view");
    const status = document.getElementById("status");
    const apiUrl = document.getElementById("api-url");
    let timer;

    function mode() { return document.querySelector("input[name=mode]:checked").value; }
    function updateLabels() {
      controls.forEach(control => document.getElementById(`${control.id}-value`).textContent = `${control.value}°`);
    }
    function refreshView() {
      updateLabels();
      const query = new URLSearchParams({ yaw: yaw.value, pitch: pitch.value, fov: fov.value, mode: mode(), t: Date.now() });
      const url = `/pano/view?${query}`;
      apiUrl.textContent = url;
      image.src = url;
    }
    async function refreshInfo() {
      try {
        const response = await fetch("/pano/info");
        const info = await response.json();
        status.textContent = response.ok ? `พร้อมใช้งาน: ${info.source} — ${info.width}×${info.height}` : `Server error: ${info.message}`;
      } catch (error) { status.textContent = `ต่อ server ไม่ได้: ${error.message}`; }
    }
    controls.forEach(control => control.addEventListener("input", refreshView));
    document.querySelectorAll("input[name=mode]").forEach(control => control.addEventListener("change", refreshView));
    document.getElementById("refresh").addEventListener("click", refreshView);
    document.getElementById("left").addEventListener("click", () => { yaw.value = Number(yaw.value) - 30; refreshView(); });
    document.getElementById("right").addEventListener("click", () => { yaw.value = Number(yaw.value) + 30; refreshView(); });
    document.getElementById("auto-refresh").addEventListener("change", event => {
      clearInterval(timer);
      if (event.target.checked) timer = setInterval(refreshView, 500);
    });
    image.addEventListener("error", () => { status.textContent = "โหลดภาพไม่สำเร็จ — ตรวจ server และ camera source"; });
    refreshInfo();
    refreshView();
  </script>
</body>
</html>
